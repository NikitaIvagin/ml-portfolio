name: Fix Notebook Metadata

on:
  workflow_dispatch:   # запуск вручную из вкладки Actions

jobs:
  fix-notebooks:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run fix script
        run: |
          import json
          import glob
          import os

          for nb_path in glob.glob("**/*.ipynb", recursive=True):
              with open(nb_path, "r", encoding="utf-8") as f:
                  nb = json.load(f)
              if "widgets" in nb.get("metadata", {}):
                  del nb["metadata"]["widgets"]
                  with open(nb_path, "w", encoding="utf-8") as f:
                      json.dump(nb, f, indent=1, ensure_ascii=False)
                  print(f"Fixed: {nb_path}")
              else:
                  print(f"OK:    {nb_path}")
        shell: python

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove invalid widgets metadata from notebooks"
            git push
          fi
